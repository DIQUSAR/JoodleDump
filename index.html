<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Joodle Dump</title>
    <link rel="icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preload" href="img/background.png" as="image" fetchpriority="high">
    <link rel="preload" href="img/background_dark.png" as="image" fetchpriority="high">

    <link rel="preload" href="img/sound_on.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/sound_off.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/pause.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/play.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/restart.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/menu.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/settings.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/shop.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/lb.png" as="image" fetchpriority="low">

    <link rel="preload" href="img/light_mode.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/lang.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/skip.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/revive.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/arrow_left.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/arrow_right.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/keyboard.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/touch.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/gyro.png" as="image" fetchpriority="low">

    <link rel="preload" href="img/lock.png" as="image" fetchpriority="low">
    <link rel="preload" href="img/visibility.png" as="image" fetchpriority="low">
    <!--ЯНДЕКС SDK-->
    <script>
        let _resolveSDK;
        window.yandexSDKPromise = new Promise(resolve => { _resolveSDK = resolve; });
        async function initSDK() {
            try {
                const ysdk = await YaGames.init();
                window.yandexSDK = ysdk;
                _resolveSDK(ysdk);
            } catch (e) {
                console.warn('[SDK] Инициализация не удалась:', e);
                _resolveSDK(null);
            }
        }
    </script>
    <script async src="/sdk.js" onload="initSDK()" onerror="_resolveSDK(null)"></script>
    <!--СКРИПТЫ ИГРЫ-->
    <script src="js/preloader.js" defer></script>
    <script src="js/sdk.js" defer></script>
    <script src="js/ui_config.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/constants.js" defer></script>
    <script src="js/offscreen_compat.js" defer></script>
    <script src="js/gamestate.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/player.js" defer></script>
    <script src="js/platform.js" defer></script>
    <script src="js/platform_generator.js" defer></script>
    <script src="js/physics.js" defer></script>
    <script src="js/particle.js" defer></script>
    <script src="js/inputhandler.js" defer></script>
    <script src="js/background.js" defer></script>
    <script src="js/canvas.js" defer></script>
    <script src="js/audio.js" defer></script>
    <script src="js/leaderboard.js" defer></script>
    <script src="js/adv.js" defer></script>
    <script src="js/currency.js" defer></script>
    <script src="js/hud.js" defer></script>
    <script src="js/passives.js" defer></script>
    <script src="js/actives.js" defer></script>
    <script src="js/diamond_item.js" defer></script>
    <script src="js/shop.js" defer></script>
    <script src="js/yandex_sync.js" defer></script>
    <!--ЭКРАНЫ-->
    <script src="js/screens/screen_menu.js" defer></script>
    <script src="js/screens/screen_pause.js" defer></script>
    <script src="js/screens/screen_revive.js" defer></script>
    <script src="js/screens/screen_death.js" defer></script>
    <script src="js/screens/screen_leaderboard.js" defer></script>
    <script src="js/screens/screen_settings.js" defer></script>
    <!--КООРДИНАТОР И ЦИКЛ-->
    <script src="js/start.js" defer></script>
    <script src="js/loop.js" defer></script>
</head>
<body>
    <div id="gameWrapper">
        <canvas id="gameCanvas" width="380" height="620"></canvas>
        <div id="scoreDisplay">0</div>
        <div id="highScoreDisplay">Рекорд: 0</div>
        <div id="diamondDisplay" style="display:none;">💎 0</div>
        <div id="loadingScreen">
            <span id="loadingText">Загрузка</span><span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
            <div id="loadingBarWrap"><div id="loadingBar"></div></div>
        </div>
        <div id="overlay"></div>
        <button id="pauseBtn" style="display:none;">⏸</button>
        <div id="pauseScreen" style="display:none;"></div>
        <div id="controls" style="display: none;">
            <div class="ctrl-btn" id="btnLeft"  data-ui-ctrl="left">◀</div>
            <div class="ctrl-btn" id="btnRight" data-ui-ctrl="right">▶</div>
        </div>
    </div>
</body>
</html>
